services:
  db:
    image: ankane/pgvector:v0.5.1
    shm_size: 256mb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./videos:/app/storage/videos

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: ./api
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/db
      REDIS_URL: redis://redis:6379/0
      VIDEO_STORAGE_PATH: /app/storage/videos
      MODEL_STORAGE_PATH: /app/storage/models
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./models:/app/storage/models
      - ./videos:/app/storage/videos
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/db
      REDIS_URL: redis://redis:6379/0
      VIDEO_STORAGE_PATH: /app/storage/videos
      MODEL_STORAGE_PATH: /app/storage/models
    env_file:
      - .env
    volumes:
      - ./worker:/app
      - ./api/core:/app/core
      - ./seed_kaggle.py:/app/seed_kaggle.py
      - ./backfill_iv.py:/app/backfill_iv.py
      - ./youtube_recommendation_data.csv:/app/youtube_recommendation_data.csv
      - ./ndcg_test.py:/app/ndcg_test.py
      - ./amazon_enricher.py:/app/amazon_enricher.py
      - ./interaction_simulator.py:/app/interaction_simulator.py
      - ./models:/app/storage/models
      - ./videos:/app/storage/videos
    depends_on:
      - db
      - redis

volumes:
  pgdata:
