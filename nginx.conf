events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic Rate Limiting: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Logging format to see real client IPs if behind another proxy
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name localhost;

        # Block common malicious/probing paths instantly
        location ~* \.(php|asp|aspx|jsp|cgi|exe|dll|zip|rar)$ {
            return 404;
        }

        location ~* /(cgi-bin|wp-admin|wp-content|wp-includes|setup|config|myadmin|pma|phpmyadmin|shell|cmd|backup|api/v1/ml/status) {
            return 404;
        }

        # Main API Proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
